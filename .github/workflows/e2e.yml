name: E2E Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Runs only after merge to main.
permissions: read-all

jobs:
  e2e-openai:
    name: E2E OpenAI CLI
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Run OpenAI e2e tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INTEGRATION_MODEL: ${{ vars.OPENAI_INTEGRATION_MODEL }}
        run: make test-integration-openai

  e2e-gemini:
    name: E2E Gemini CLI
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Run Gemini e2e tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: make test-integration-gemini

  e2e-anthropic:
    name: E2E Anthropic CLI
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Run Anthropic e2e tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-integration-anthropic
