name: Tag

on:
  push:
    branches: ["main"]

permissions: read-all

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Verify Dependencies
        run: make verify-deps

      - name: Validate Installer Scripts
        run: .github/scripts/validate-installer-scripts.sh

      - name: Install shellcheck
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Run Validation Gate
        run: make verify

      - name: Check Binary Size
        run: make check-size

  tag:
    name: Create Version Tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release requires full history to determine next version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Create version tag
        run: npm run semantic-release -- --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
