name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.9

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Verify Dependencies
        run: make verify-deps

      - name: Validate Installer Scripts
        run: .github/scripts/validate-installer-scripts.sh

      - name: Install shellcheck
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Run Tests
        run: make test

      - name: Run E2E Smoke
        run: make test-e2e-smoke

      - name: Run Coverage
        run: make test-cover-report

      # - name: Fuzz Smoke Test
      #   run: make test-fuzz

      - name: Check Binary Size
        run: make check-size

      - name: Check Docker Credentials
        id: docker_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/scripts/check-docker-creds.sh

      - name: Log in to DHI registry
        if: ${{ steps.docker_creds.outputs.enabled == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Smoke
        if: ${{ steps.docker_creds.outputs.enabled == 'true' }}
        run: make docker-smoke
