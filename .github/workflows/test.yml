name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9

      - name: Download Dependencies
        run: go mod download 2>/dev/null

      - name: Verify Dependencies
        run: make verify-deps

      - name: Validate Installer Scripts
        run: .github/scripts/validate-installer-scripts.sh

      - name: Install shellcheck
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Run Tests
        run: make test

      - name: Run E2E Smoke
        run: make test-e2e-smoke

      - name: Run Coverage
        run: make test-cover-report

      # - name: Fuzz Smoke Test
      #   run: make test-fuzz

      - name: Check Binary Size
        run: make check-size

      - name: Check Docker Credentials
        id: docker_creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/scripts/check-docker-creds.sh

      - name: Log in to DHI registry
        if: ${{ steps.docker_creds.outputs.enabled == 'true' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Smoke
        if: ${{ steps.docker_creds.outputs.enabled == 'true' }}
        run: make docker-smoke
